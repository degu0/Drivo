services:
  database:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - drivo_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?defina POSTGRES_USER no .env}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@database:5432/${POSTGRES_DB:?defina POSTGRES_DB no .env}?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?defina GEMINI_API_KEY no .env}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:?defina GEMINI_TEXT_MODEL no .env}
      PORT: 3333
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3333:3333"
    volumes:
      - drivo_uploads:/app/uploads

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://api:3333/api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  drivo_data:
  drivo_uploads:
